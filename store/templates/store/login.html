{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GlowStock</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #fff7f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(128, 0, 32, 0.12);
        }

        /* GlowStock Logo */
        .logo {
            text-align: center;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .logo .glow {
            color: #f21872;
        }

        .logo .stock {
            color: #5a1835;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }
label {
    display: block;
    margin-bottom: 8px;
    color: #5a1835;
    font-weight: 600;
}

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #800020;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #f21872;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #d91465;
        }

        .error {
            background: #ffe6e6;
            color: #a00000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .register-text a {
            color: #800020;
            font-weight: bold;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <span class="glow">Glow</span><span class="stock">Stock</span>
        </div>

        <div class="subtitle">
            Login to your account
        </div>

        {% if form.errors %}
            <div class="error">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register-text">
            Don't have an account?
            <a href="{% url 'register' %}">
                Create Account
            </a>
        </div>

    </div>

</body>
</html>
